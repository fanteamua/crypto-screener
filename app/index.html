<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CryptoScreener PRO — термінал</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#0b0d10; --panel:#101418; --border:#1d2329; --text:#d1d4dc; --muted:#787f8a;
  --green:#2ebd85; --red:#f6465d; --purple:#b57bee; --yellow:#f0b90b; --accent:#3861fb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.45 Inter,system-ui,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;font-variant-numeric:tabular-nums}
#topbar{height:44px;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.logo{font-weight:700;letter-spacing:.3px;white-space:nowrap}
.logo b{color:var(--yellow)}
#tfBar{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#tfBar button{background:none;border:0;color:var(--muted);font:11px Inter;padding:4px 7px;border-radius:4px;cursor:pointer}
#tfBar button:hover{color:var(--text);background:#1a2027}
#tfBar button.active{background:#2a2e39;color:#fff}
#search{background:#0b0d10;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;width:150px;outline:none}
.btn-pro{background:linear-gradient(135deg,#f0b90b,#f8d33a);color:#111;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
/* ── ГОЛОВНЕ: layout завжди = висота екрана, без прокрутки ── */
#layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:calc(100vh - 44px);height:calc(100dvh - 44px)}
#charts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--border);min-height:0;min-width:0;overflow:hidden}
.pane{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.pane.active{box-shadow:inset 0 0 0 1px #2a303a}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 10px 2px;flex:0 0 auto}
.pair .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.pair b{font-size:12px}
.tf-badge{background:#1a2027;color:var(--muted);border-radius:4px;padding:1px 6px;font-size:10px}
.legend{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden}
.chart{flex:1 1 auto;min-height:0;min-width:0;width:100%}
#screener{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.scr-head,.row{display:grid;grid-template-columns:1fr 62px 62px 74px;gap:6px;padding:0 12px;align-items:center}
.scr-head{height:34px;color:var(--muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);flex:0 0 auto}
.scr-head span:not(:first-child),.row span:not(:first-child){text-align:right}
#rows{flex:1;overflow-y:auto;min-height:0}
.row{height:30px;cursor:pointer;border-bottom:1px solid #14181d}
.row:hover{background:#161b21}
.row.sel{background:#1a2027;box-shadow:inset 2px 0 0 var(--accent)}
.row .s b{font-weight:600}
.row .s em{color:var(--muted);font-style:normal;font-size:10px}
.pos{color:var(--green)} .neg{color:var(--red)}
.natr{color:var(--text)} .natr.hot{color:var(--yellow)}
.vol{color:var(--purple)}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}
#modal.hidden{display:none}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;width:min(860px,94vw)}
.modal-card h2{margin-bottom:4px}
.modal-card p{color:var(--muted);margin-bottom:20px}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.plan{border:1px solid var(--border);border-radius:10px;padding:18px 14px;text-align:center;position:relative}
.plan.best{border-color:var(--yellow)}
.plan .save{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#111;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px}
.plan h3{font-size:14px}
.plan .price{font-size:26px;font-weight:800;margin:8px 0 2px}
.plan .per{color:var(--muted);font-size:11px;margin-bottom:14px}
.plan button{width:100%;background:#2a2e39;color:#fff;border:0;border-radius:6px;padding:8px;cursor:pointer}
.plan.best button{background:var(--yellow);color:#111;font-weight:700}
@media(max-width:900px){#layout{grid-template-columns:1fr}#screener{display:none}.plans{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header id="topbar">
  <div class="logo">₿ CryptoScreener <b>PRO</b></div>
  <nav id="tfBar"></nav>
  <input id="search" placeholder="Пошук монети…">
  <button class="btn-pro" id="upgradeBtn">⭐ PRO</button>
</header>

<div id="layout">
  <div id="charts">
    <div class="pane active"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">15m</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">1h</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">4h</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">1d</span><span class="legend"></span></div><div class="chart"></div></div>
  </div>
  <aside id="screener">
    <div class="scr-head"><span>Символ</span><span>24h %</span><span>NATR %</span><span>24h $</span></div>
    <div id="rows"></div>
  </aside>
</div>

<div id="modal" class="hidden">
  <div class="modal-card">
    <h2>PRO-підписка</h2>
    <p>Повна сітка графіків, усі таймфрейми, алерти, розширений скрінер та експорт.</p>
    <div class="plans">
      <div class="plan"><h3>1 місяць</h3><div class="price">$12</div><div class="per">$12/міс</div><button data-plan="m1">Оформити</button></div>
      <div class="plan"><h3>3 місяці</h3><div class="price">$30</div><div class="per">$10/міс</div><button data-plan="m3">Оформити</button></div>
      <div class="plan best"><div class="save">−25%</div><h3>6 місяців</h3><div class="price">$54</div><div class="per">$9/міс</div><button data-plan="m6">Оформити</button></div>
      <div class="plan"><div class="save">−38%</div><h3>1 рік</h3><div class="price">$89</div><div class="per">$7.4/міс</div><button data-plan="m12">Оформити</button></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const BASE='https://data-api.binance.vision/api/v3';
const WSB ='wss://data-stream.binance.vision/stream?streams=';
const TFS=['1s','5s','15s','30s','1m','3m','5m','15m','30m','1h','4h','1d','1w','1M'];
const UP='#2ebd85', DN='#f6465d';
let SYMBOL='BTCUSDT', activePane=0, ws=null, screenerData=[], natrMap={};

$('#tfBar').innerHTML=TFS.map(t=>`<button data-tf="${t}">${t}</button>`).join('');
$('#tfBar').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const p=panes[activePane]; p.tf=b.dataset.tf; p.badge.textContent=p.tf;
  loadPane(p,SYMBOL); subscribeWS();
};

/* Панелі: TF за замовчуванням 15m / 1h / 4h / 1d */
const panes=[...document.querySelectorAll('.pane')].map((el,i)=>{
  const chart=LightweightCharts.createChart(el.querySelector('.chart'),{
    autoSize:true,
    layout:{background:{type:'solid',color:'#0b0d10'},textColor:'#787f8a',fontSize:10},
    grid:{vertLines:{color:'#12161b'},horzLines:{color:'#12161b'}},
    rightPriceScale:{borderColor:'#1d2329'},
    timeScale:{borderColor:'#1d2329',timeVisible:true,secondsVisible:false},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  });
  const series=chart.addCandlestickSeries({upColor:UP,downColor:DN,wickUpColor:UP,wickDownColor:DN,borderUpColor:UP,borderDownColor:DN});
  const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
  el.addEventListener('click',()=>{activePane=i;document.querySelectorAll('.pane').forEach((x,j)=>x.classList.toggle('active',j===i));});
  return {el,chart,series,vol,tf:['15m','1h','4h','1d'][i],
          legend:el.querySelector('.legend'),badge:el.querySelector('.tf-badge'),symEl:el.querySelector('.sym')};
});

const fmtP=p=>p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:1}):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
const fmtV=v=>v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0);
function setLegend(p,c){const col=c.close>=c.open?UP:DN;
  p.legend.innerHTML=`O <b style="color:${col}">${fmtP(c.open)}</b> H <b style="color:${col}">${fmtP(c.high)}</b> L <b style="color:${col}">${fmtP(c.low)}</b> C <b style="color:${col}">${fmtP(c.close)}</b> V <b style="color:#b57bee">${fmtV(c.volume)}</b>`;}
async function getKlines(sym,tf,limit=300){
  const r=await fetch(`${BASE}/klines?symbol=${sym}&interval=${tf}&limit=${limit}`);
  return (await r.json()).map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
}
async function loadPane(p,sym){
  const k=await getKlines(sym,p.tf);
  p.series.setData(k.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
  p.vol.setData(k.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(46,189,133,.4)':'rgba(246,70,93,.4)'})));
  setLegend(p,k[k.length-1]);
}

function subscribeWS(){
  if(ws) ws.close();
  const streams=[...new Set(panes.map(p=>`${SYMBOL.toLowerCase()}@kline_${p.tf}`))].join('/');
  ws=new WebSocket(WSB+streams);
  ws.onmessage=e=>{
    const k=JSON.parse(e.data)?.data?.k; if(!k) return;
    const c={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};
    panes.filter(p=>p.tf===k.i).forEach(p=>{
      p.series.update(c);
      p.vol.update({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(46,189,133,.4)':'rgba(246,70,93,.4)'});
      setLegend(p,c);
    });
  };
}
function loadAll(sym){
  SYMBOL=sym;
  panes.forEach(p=>{p.symEl.textContent=sym; loadPane(p,sym);});
  subscribeWS(); renderRows();
}

function natrOf(k){ if(k.length<2) return 0;
  const tr=[]; for(let i=1;i<k.length;i++){const h=k[i].high,l=k[i].low,pc=k[i-1].close;
    tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}
  const n=Math.min(14,tr.length), atr=tr.slice(-n).reduce((a,b)=>a+b,0)/n;
  return atr/k[k.length-1].close*100;
}
async function mapLimit(items,lim,fn){const res=[];let i=0;
  await Promise.all(Array.from({length:lim},async()=>{while(i<items.length){const x=i++;res[x]=await fn(items[x]);}}));
  return res;}
async function loadScreener(){
  const t=await fetch(BASE+'/ticker/24hr').then(r=>r.json());
  if(!Array.isArray(t)) return;
  screenerData=t.filter(x=>x.symbol.endsWith('USDT')&&!/UP|DOWN|BULL|BEAR/.test(x.symbol))
    .map(x=>({s:x.symbol,chg:+x.priceChangePercent,vol:+x.quoteVolume}))
    .sort((a,b)=>b.vol-a.vol).slice(0,40);
  const n=await mapLimit(screenerData.slice(0,30),6,async x=>[x.s,natrOf(await getKlines(x.s,'1d',16))]);
  natrMap=Object.fromEntries(n); renderRows();
}
async function refreshTickers(){
  const t=await fetch(BASE+'/ticker/24hr').then(r=>r.json());
  if(!Array.isArray(t)) return;
  const m=Object.fromEntries(t.map(x=>[x.symbol,x]));
  screenerData.forEach(r=>{const x=m[r.s]; if(x){r.chg=+x.priceChangePercent; r.vol=+x.quoteVolume;}});
  renderRows();
}
function renderRows(){
  const q=$('#search').value.trim().toUpperCase();
  $('#rows').innerHTML=screenerData.filter(r=>r.s.includes(q)).map(r=>{
    const n=natrMap[r.s];
    return `<div class="row ${r.s===SYMBOL?'sel':''}" data-s="${r.s}">
      <span class="s"><b>${r.s.replace('USDT','')}</b><em>/USDT</em></span>
      <span class="${r.chg>=0?'pos':'neg'}">${r.chg.toFixed(2)}</span>
      <span class="natr ${n>=1.5?'hot':''}">${n!=null?n.toFixed(2):'—'}</span>
      <span class="vol">${fmtV(r.vol)}</span></div>`;
  }).join('');
}
$('#rows').onclick=e=>{const r=e.target.closest('.row'); if(r) loadAll(r.dataset.s);};
$('#search').oninput=renderRows;

$('#upgradeBtn').onclick=()=>$('#modal').classList.remove('hidden');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden');};
document.querySelectorAll('.plan button').forEach(b=>b.onclick=()=>{ location.href='../index.html#pricing'; });

loadAll('BTCUSDT'); loadScreener(); setInterval(refreshTickers,10000);
</script>
</body>
</html>
