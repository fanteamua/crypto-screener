<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CryptoScreener PRO — terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#101418;--border:#1d2329;--text:#d1d4dc;--muted:#787f8a;--green:#2ebd85;--red:#f6465d;--purple:#b57bee;--yellow:#f0b90b;--accent:#3861fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:12px/1.45 Inter,system-ui,Roboto,sans-serif;overflow:hidden;font-variant-numeric:tabular-nums}
#topbar{height:44px;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.back{color:var(--muted);text-decoration:none;font-size:11px;white-space:nowrap}
.back:hover{color:var(--text)}
.logo{font-weight:700;letter-spacing:.3px;white-space:nowrap}
.logo b{color:var(--yellow)}
#tfBar{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#tfBar button{background:none;border:0;color:var(--muted);font:11px Inter;padding:4px 7px;border-radius:4px;cursor:pointer}
#tfBar button:hover{color:var(--text);background:#1a2027}
#search{background:#0b0d10;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;width:150px;outline:none}
.btn-pro{background:linear-gradient(135deg,#f0b90b,#f8d33a);color:#111;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
#layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:calc(100vh - 44px);height:calc(100dvh - 44px)}
#charts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--border);min-height:0;min-width:0;overflow:hidden}
.pane{background:var(--bg);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane.active{box-shadow:inset 0 0 0 1px #2a303a}
.pane-h{display:flex;align-items:center;gap:8px;padding:6px 10px 2px;flex:0 0 auto}
.pair .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}
.tf-badge{background:#1a2027;color:var(--muted);border-radius:4px;padding:1px 6px;font-size:10px}
.legend{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden}
.chart{flex:1 1 auto;min-height:0;min-width:0;width:100%}
#screener{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.scr-head,.row{display:grid;grid-template-columns:1fr 62px 62px 74px;gap:6px;padding:0 12px;align-items:center}
.scr-head{height:34px;color:var(--muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);flex:0 0 auto}
.scr-head span:not(:first-child),.row span:not(:first-child){text-align:right}
.scr-head span{cursor:pointer;user-select:none}
.scr-head span:hover{color:var(--text)}
.scr-head span.sorted{color:var(--yellow)}
.scr-head i{font-style:normal;font-size:8px}
#rows{flex:1;overflow-y:auto;min-height:0}
.row{height:30px;cursor:pointer;border-bottom:1px solid #14181d}
.row:hover{background:#161b21}
.row.sel{background:#1a2027;box-shadow:inset 2px 0 0 var(--accent)}
.row .s b{font-weight:600}.row .s em{color:var(--muted);font-style:normal;font-size:10px}
.pos{color:var(--green)}.neg{color:var(--red)}
.natr{color:var(--text)}.natr.hot{color:var(--yellow)}.natr.loading{color:var(--muted);font-size:9px}
.vol{color:var(--purple)}
@media(max-width:900px){#layout{grid-template-columns:1fr}#screener{display:none}}
</style>
</head>
<body>
<header id="topbar">
  <a class="back" href="/app/">← Screener</a>
  <div class="logo">₿ CryptoScreener <b>PRO</b></div>
  <nav id="tfBar"></nav>
  <input id="search" placeholder="Search coin…">
  <a class="btn-pro" href="/#pricing">⭐ PRO</a>
</header>
<div id="layout">
  <div id="charts">
    <div class="pane active"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">15m</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">1h</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">4h</span><span class="legend"></span></div><div class="chart"></div></div>
    <div class="pane"><div class="pane-h"><span class="pair"><i class="dot"></i><b class="sym">BTCUSDT</b></span><span class="tf-badge">1d</span><span class="legend"></span></div><div class="chart"></div></div>
  </div>
  <aside id="screener">
    <div class="scr-head"><span data-key="sym">Symbol <i></i></span><span data-key="chg">24h % <i></i></span><span data-key="natr">NATR % <i></i></span><span data-key="vol">24h $ <i></i></span></div>
    <div id="rows"></div>
  </aside>
</div>
<script>
const $=s=>document.querySelector(s);
const BASE='https://data-api.binance.vision/api/v3';
const WSB='wss://data-stream.binance.vision/stream?streams=';
const TFS=['1s','5s','15s','30s','1m','3m','5m','15m','30m','1h','4h','1d','1w','1M'];
const UP='#2ebd85',DN='#f6465d';
let SYMBOL='BTCUSDT',activePane=0,ws=null,screenerData=[],natrMap={},natrCache={};
const NATR_TTL=7200000,LIST_KEY='scr_list_cache';
try{natrCache=JSON.parse(localStorage.getItem('natr_cache')||'{}');}catch{}
function saveCache(){try{localStorage.setItem('natr_cache',JSON.stringify(natrCache));}catch{}}
function getCachedNatr(s){const c=natrCache[s];if(c&&Date.now()-c.t<NATR_TTL)return c.v;return null;}
function setCachedNatr(s,v){natrCache[s]={v,t:Date.now()};}
$('#tfBar').innerHTML=TFS.map(t=>`<button data-tf="${t}">${t}</button>`).join('');
$('#tfBar').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=panes[activePane];p.tf=b.dataset.tf;p.badge.textContent=p.tf;loadPane(p,SYMBOL);subscribeWS();};
const panes=[...document.querySelectorAll('.pane')].map((el,i)=>{
  const chart=LightweightCharts.createChart(el.querySelector('.chart'),{autoSize:true,layout:{background:{type:'solid',color:'#0b0d10'},textColor:'#787f8a',fontSize:10},grid:{vertLines:{color:'#12161b'},horzLines:{color:'#12161b'}},rightPriceScale:{borderColor:'#1d2329'},timeScale:{borderColor:'#1d2329',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal}});
  const series=chart.addCandlestickSeries({upColor:UP,downColor:DN,wickUpColor:UP,wickDownColor:DN,borderUpColor:UP,borderDownColor:DN});
  const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
  el.addEventListener('click',()=>{activePane=i;document.querySelectorAll('.pane').forEach((x,j)=>x.classList.toggle('active',j===i));});
  return {el,chart,series,vol,tf:['15m','1h','4h','1d'][i],legend:el.querySelector('.legend'),badge:el.querySelector('.tf-badge'),symEl:el.querySelector('.sym')};
});
const fmtP=p=>p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:1}):p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
const fmtV=v=>v>=1e9?(v/1e9).toFixed(1)+'B':v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0);
function setLegend(p,c){const col=c.close>=c.open?UP:DN;p.legend.innerHTML=`O <b style="color:${col}">${fmtP(c.open)}</b> H <b style="color:${col}">${fmtP(c.high)}</b> L <b style="color:${col}">${fmtP(c.low)}</b> C <b style="color:${col}">${fmtP(c.close)}</b> V <b style="color:#b57bee">${fmtV(c.volume)}</b>`;}
const reqCache=new Map();
async function cachedFetch(url,age){const n=Date.now();const h=reqCache.get(url);if(h&&n-h.t<age)return h.d;const r=await fetch(url);const d=await r.json();reqCache.set(url,{d,t:n});return d;}
async function poolLimit(items,limit,fn){let i=0;const w=Array.from({length:Math.min(limit,items.length)},async()=>{while(i<items.length){const x=i++;await fn(items[x]);}});await Promise.all(w);}
async function getKlines(sym,tf,limit=200){const r=await cachedFetch(`${BASE}/klines?symbol=${sym}&interval=${tf}&limit=${limit}`,5000);return r.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));}
async function getKlinesRetry(sym,tf,limit){for(let i=0;i<3;i++){try{const k=await getKlines(sym,tf,limit);if(Array.isArray(k)&&k.length)return k;}catch{}await new Promise(r=>setTimeout(r,400*(i+1)));}return [];}
async function loadPane(p,sym){const k=await getKlinesRetry(sym,p.tf,200);if(!k.length)return;p.series.setData(k.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));p.vol.setData(k.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(46,189,133,.4)':'rgba(246,70,93,.4)'})));setLegend(p,k[k.length-1]);}
function subscribeWS(){if(ws)ws.close();const streams=[...new Set(panes.map(p=>`${SYMBOL.toLowerCase()}@kline_${p.tf}`))].join('/');ws=new WebSocket(WSB+streams);ws.onmessage=e=>{const k=JSON.parse(e.data)?.data?.k;if(!k)return;const c={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v};panes.filter(p=>p.tf===k.i).forEach(p=>{p.series.update(c);p.vol.update({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(46,189,133,.4)':'rgba(246,70,93,.4)'});setLegend(p,c);});};}
function loadAll(sym){SYMBOL=sym;panes.forEach(p=>{p.symEl.textContent=sym;loadPane(p,sym);});subscribeWS();renderRows();}
function natrOf(k){if(k.length<2)return 0;const tr=[];for(let i=1;i<k.length;i++){const h=k[i].high,l=k[i].low,pc=k[i-1].close;tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}const n=Math.min(14,tr.length),a=tr.slice(-n).reduce((x,y)=>x+y,0)/n;return a/k[k.length-1].close*100;}
async function lazyLoadNatr(items){for(const r of items){const c=getCachedNatr(r.s);if(c!=null)natrMap[r.s]=c;}renderRows();const toLoad=items.filter(r=>natrMap[r.s]==null);await poolLimit(toLoad,10,async r=>{try{const k=await getKlines(r.s,'1d',16);const n=natrOf(k);natrMap[r.s]=n;setCachedNatr(r.s,n);renderRows();}catch{}});saveCache();renderRows();}
async function loadScreener(){try{const c=JSON.parse(localStorage.getItem(LIST_KEY)||'null');if(Array.isArray(c)&&c.length){screenerData=c;renderRows();}}catch{}const t=await cachedFetch(BASE+'/ticker/24hr',15000);if(!Array.isArray(t))return;screenerData=t.filter(x=>x.symbol.endsWith('USDT')&&!/UP|DOWN|BULL|BEAR/.test(x.symbol)).map(x=>({s:x.symbol,chg:+x.priceChangePercent,vol:+x.quoteVolume})).sort((a,b)=>b.vol-a.vol).slice(0,30);try{localStorage.setItem(LIST_KEY,JSON.stringify(screenerData));}catch{}renderRows();lazyLoadNatr(screenerData.slice(0,20));}
let refreshTimer=null;
async function refreshTickers(){if(refreshTimer)return;refreshTimer=setTimeout(async()=>{refreshTimer=null;try{const t=await cachedFetch(BASE+'/ticker/24hr',30000);if(!Array.isArray(t))return;const m=Object.fromEntries(t.map(x=>[x.symbol,x]));let ch=false;screenerData.forEach(r=>{const x=m[r.s];if(x&&(r.chg!==+x.priceChangePercent||r.vol!==+x.quoteVolume)){r.chg=+x.priceChangePercent;r.vol=+x.quoteVolume;ch=true;}});if(ch)renderRows();}catch{}},100);}
let sortKey='vol',sortDir=-1;
function sortVal(r){if(sortKey==='chg')return r.chg;if(sortKey==='natr'){const n=natrMap[r.s]??getCachedNatr(r.s);return n==null?-Infinity:n;}return r.vol;}
function updateSortUI(){document.querySelectorAll('.scr-head span[data-key]').forEach(sp=>{const k=sp.dataset.key,a=k===sortKey;sp.classList.toggle('sorted',a);sp.querySelector('i').textContent=a?(sortDir===1?'▲':'▼'):'';});}
document.querySelector('.scr-head').addEventListener('click',e=>{const sp=e.target.closest('span[data-key]');if(!sp)return;const k=sp.dataset.key;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='sym')?1:-1;}updateSortUI();renderRows();});
let renderPending=false;
function renderRows(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;const q=$('#search').value.trim().toUpperCase();const list=screenerData.filter(r=>r.s.includes(q)).sort((a,b)=>{if(sortKey==='sym')return a.s.localeCompare(b.s)*sortDir;return (sortVal(a)-sortVal(b))*sortDir;});$('#rows').innerHTML=list.map(r=>{const n=natrMap[r.s];const c=getCachedNatr(r.s);const v=n!=null?n.toFixed(2):c!=null?c.toFixed(2):null;return `<div class="row ${r.s===SYMBOL?'sel':''}" data-s="${r.s}"><span class="s"><b>${r.s.replace('USDT','')}</b><em>/USDT</em></span><span class="${r.chg>=0?'pos':'neg'}">${r.chg.toFixed(2)}</span><span class="natr ${v&&parseFloat(v)>=1.5?'hot':''} ${v==null?'loading':''}">${v!=null?v:'...'}</span><span class="vol">${fmtV(r.vol)}</span></div>`;}).join('');});}
$('#rows').onclick=e=>{const r=e.target.closest('.row');if(r)loadAll(r.dataset.s);};
$('#search').oninput=renderRows;
updateSortUI();
const INIT=(new URLSearchParams(location.search).get('sym')||'').toUpperCase();
loadAll(INIT.endsWith('USDT')?INIT:'BTCUSDT');loadScreener();setInterval(refreshTickers,15000);
</script>
</body>
</html>
